# wrangler.toml - le Worker de la demo figee de Reef (moteur eteint) : langue du visiteur, plans du site, page introuvable.
# ...
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "reefoss"

[[d1_databases]]
binding = "DB"
database_id = "b8b3f0d0-5854-4a4c-a795-58b159b40a26"
# ...

name = "yhbzyssite"
main = "src/worker.ts"
compatibility_date = "2026-08-14"

[assets]
directory = "./dist"
binding = "ASSETS"

# Le worker doit voir TOUTES les requetes, sinon "/" servirait index.html
# directement et la redirection de langue ne s'executerait jamais. C'est pour
# cette raison que le worker teste lui-meme l'extension du chemin avant de
# rediriger : il laisse passer les feuilles de style et les scripts.
run_worker_first = true

# Astro produit un 404.html : on le sert au lieu d'une reponse vide.
not_found_handling = "404-page"
